name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The release build is signed with the debug key (see app/build.gradle.kts). A fresh runner would
      # generate a new random debug key every run, so APKs from different runs could not update each other.
      # Store your ~/.android/debug.keystore as base64 in the DEBUG_KEYSTORE_BASE64 secret to keep it stable.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      # Model weights are not committed. Set the MODEL_URL repository variable to bundle a detector;
      # without it the APK still builds and runs in "lanes only" mode.
      - name: Download detector model
        env:
          MODEL_URL: ${{ vars.MODEL_URL }}
        if: env.MODEL_URL != ''
        run: curl -fsSL "$MODEL_URL" -o app/src/main/assets/yolo_detector.tflite

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        id: apk
        run: |
          name="DriveSentinel-${GITHUB_REF_NAME//\//-}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
